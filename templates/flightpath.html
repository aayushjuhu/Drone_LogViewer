    <script>
        var altitudeData = {{ att_fig | safe }};
        var aglData = {{ agl_fig | safe }};
        var currData = {{ curr_fig | safe }};
        var rpyData = {{ rpy_fig | safe }};
        var config={scrollZoom: true};

        Plotly.newPlot('altitudeGraph',altitudeData.data, altitudeData.layout, config);
        Plotly.newPlot('aglGraph',aglData.data, aglData.layout, config);
        Plotly.newPlot('currGraph',currData.data, currData.layout, config);
        Plotly.newPlot('rpyGraph',rpyData.data, rpyData.layout);
        
        
        // Initialize Cesium viewer
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJjN2Y5NjdlNC02NDk0LTRkNzAtOTFmMy1hYmM0ZDZmNjNjOTUiLCJpZCI6MjQyNTgyLCJpYXQiOjE3MjY3NTIyMTJ9._P1Ssv1KUJXc3KVYCUet_4GvJmD9f-UPPq96vus-dzg';
        var viewer = new Cesium.Viewer('cesiumContainer');

        viewer.scene.globe.depthTestAgainstTerrain = true;

        // Fetch flight data (Lat, Lng, Alt) from Flask backend
        async function fetchFlightData() {
            const response = await fetch('/get_flight_data');
            const flightData = await response.json();
            return flightData;
        }
        
        // Validate flight data point (Lat, Lng, Alt)
        function isValidFlightDataPoint(point) {    
            return (
                point.Lat !== undefined && point.Lat !== null &&
                point.Lng !== undefined && point.Lng !== null &&
                point.Alt !== undefined && point.Alt !== null &&
                !isNaN(point.Lat) && !isNaN(point.Lng) && !isNaN(point.Alt)
            );
        }
        
        // Visualize flight path with a moving 3D model drone
        function visualizeFlightPath(flightData) {
            
            var startTime = Cesium.JulianDate.now();
            var stopTime = Cesium.JulianDate.addSeconds(startTime, flightData.length, new Cesium.JulianDate());
            viewer.clock.startTime = startTime.clone();
            viewer.clock.stopTime = stopTime.clone();
            viewer.clock.currentTime = startTime.clone();
            viewer.clock.clockRange = Cesium.ClockRange.LOOP_STOP;
            viewer.clock.multiplier = 1;

            var positionProperty = new Cesium.SampledPositionProperty();

            var validPositions = flightData.map(point => {
                if (isValidFlightDataPoint(point)) {
                    return Cesium.Cartesian3.fromDegrees(point.Lng, point.Lat, point.Alt);
                }
            }).filter(Boolean); // Filter out invalid positions
              

            var alti = []
            
            // Add valid points to the SampledPositionProperty
            flightData.forEach((point, index) => {
                if (isValidFlightDataPoint(point)) {
                    var time = Cesium.JulianDate.addSeconds(startTime, index, new Cesium.JulianDate());
                    var position = Cesium.Cartesian3.fromDegrees(point.Lng, point.Lat, point.Alt);
                    positionProperty.addSample(time, position);
                    // alti.push({ time: index, alt: point.Alt, curr: point.Curr, roll: point.Roll, pitch: point.Pitch, yaw: point.Yaw, b0: point.baro0, b1: point.baro1 });
                }
            });
            
            // Create moving drone model entity (served locally)
            var droneEntity = viewer.entities.add({
                position: positionProperty,
                model: {
                    uri: '/static/models/drone/scene.gltf', // Use the local path to your 3D model
                    minimumPixelSize: 2,
                    maximumScale: 1,
                    scale: 1, // Adjust the scale as needed
                    silhouetteColor: Cesium.Color.WHITE,
                    silhouetteSize: 2
                }
            });
            viewer.trackedEntity = droneEntity;

            if (validPositions.length > 0) {
                 viewer.entities.add({
                     polyline: {
                        positions: validPositions,
                        width: 2,
                        material: Cesium.Color.YELLOW
                    }
                });
            };

            
            
            var alt_plt=document.querySelector('#altitudeGraph');
            var agl_plt=document.querySelector('#aglGraph');
            var curr_plt=document.querySelector('#currGraph');
            var rpy_plt=document.querySelector('#rpyGraph');


            // var firstTimeInSeconds = df['TimeUS'][0];  // First time in your dataset
            // var startTime = Cesium.JulianDate.fromDate(new Date(firstTimeInSeconds * 1000));  // Convert to JulianDate (milliseconds
            // startTime=0

            alt_plt.on('plotly_hover', function (eventData) {
                var hoverTime = eventData.points[0].x;  // Time in seconds from TimeUS
                console.log("Hover Time:", hoverTime);
                
                // Convert hoverTime (in seconds) to Julian Date in Cesium
                var hoverJulianDate = Cesium.JulianDate.addSeconds(startTime, hoverTime*6, new Cesium.JulianDate());
                
                // Get corresponding position for that time from the position property (assuming positionProperty is predefined)
                var correspondingPosition = positionProperty.getValue(hoverJulianDate);
                
                if (correspondingPosition) {
                    // Set drone's position on the Cesium map
                    droneEntity.position = correspondingPosition;
            
                    // // Optionally move the camera to follow the drone
                    // viewer.camera.flyTo({
                    //     destination: correspondingPosition
                    // });
                }
                        // viewer.camera.flyTo({ destination: hoverPosition });           
                     });
                    


            agl_plt.on('plotly_hover', function (eventData) {
                        var hoverTime = eventData.points[0].x;
                        var correspondingPosition = positionProperty.getValue(Cesium.JulianDate.addSeconds(startTime, hoverTime*6, new Cesium.JulianDate()));
                        droneEntity.position = correspondingPosition;
                        // viewer.camera.flyTo({ destination: hoverPosition });           
                     });
            curr_plt.on('plotly_hover', function (eventData) {
                        var hoverTime = eventData.points[0].x;
                        var correspondingPosition = positionProperty.getValue(Cesium.JulianDate.addSeconds(startTime, hoverTime, new Cesium.JulianDate()));
                        droneEntity.position = correspondingPosition;
                        // viewer.camera.flyTo({ destination: hoverPosition });           
                     });
            rpy_plt.on('plotly_hover', function (eventData) {
                        var hoverTime = eventData.points[0].x;
                        var correspondingPosition = positionProperty.getValue(Cesium.JulianDate.addSeconds(startTime, hoverTime, new Cesium.JulianDate()));
                        droneEntity.position = correspondingPosition;
                        // viewer.camera.flyTo({ destination: hoverPosition });           
                     });

           
            if (togg == true) {
                viewer.trackedEntity = droneEntity;
            }

            // viewer.zoomTo(droneEntity); // Zoom to the drone entity
        }





        // Fetch flight data and visualize the flight path
        fetchFlightData().then(visualizeFlightPath);
    </script>
</body>
