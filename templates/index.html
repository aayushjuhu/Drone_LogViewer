<!DOCTYPE html>
<html lang="!">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oswald">
    <link rel="shortcut icon" href="/static/img/flaticon.png" type="image/x-icon">
    <!-- <script type="text/javascript" src="static/js/script.js"></script> -->
    <link rel="stylesheet" href="static/css/style.css">
    <title>LogViewer</title>
</head>

<body id="landpg">
    <!-- Image and text -->
    <div class="row" id="nvbar">
        <div class="col-sm-6">
            <nav class="navbar">
                <a class="navbar-brand" href="/">
                    <img src="/static/img/logo.png" width="180vh" height="auto" class="d-inline-block align-top" alt="">
                </a>
            </nav>
        </div>
        <div class="col-sm-6 float-right">
            <nav class="navbar justify-content-end">
                <a class="navbar-brand" href="/">
                    <img src="/static/img/aero.png" width="120vh" height="auto"
                        class="d-inline-block align-top float-right" alt="">
                </a>
            </nav>
        </div>
    </div>

    <div class="row">
        <div class="col-sm-12">
            <div class="row">
                <div class="container" id="uploadForm">
                    <div class="row">
                        <div class="col-sm-6" id="leftpane">
                            <h2 class="text-center">Get Started</h2>
                            <h5 class="text-center">Upload your log file and start visualizing drone data</h5>
                        </div>
                        <div class="col-sm-6">
                            <form class="form-class" id="uploadfrm" enctype="multipart/form-data">
                                <!-- <h1 class="text-center">Upload log file</h1> -->
                                <input class="form-control" id="upfl" type="file" name="fupload" accept=".bin"
                                    placeholder="Upload log file" required>
                                <button class="btn btn-outline-secondary" type="submit">Upload</button>
                                <div id="loading" style="background-color:white">Uploading... Please wait.</div>
                            </form>
                            <p style="font-weight: lighter;">File last modified: <span id="fd" style="font-weight: lighter;">No File Selected</span></p>
                            <p style="font-weight: lighter;">File size: <span id="fs" style="font-weight: lighter;">No File Selected</span></p>
                        </div>
                    </div>
                    <div class="progress mt-3">
                        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated"
                            role="progressbar" style="width: 0%">0%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="spinner" style="display: none;" class="text-center">
        <img id="bouncing-image" src="/static/img/aero.png" alt="">

    </div>
    <div class="text-center">
        <footer id="foot" class="foot"></footer>
    </div>
    <script>

        const time = new Date()
        document.getElementById('foot').innerHTML = "Copyright, " + time.getFullYear() + " Dronetech Solutions Pvt Ltd.";
        document.getElementById('uploadForm').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent form submission from refreshing the page

            var fileInput = document.getElementById('upfl');
            var file = fileInput.files[0];
            var formData = new FormData();
            formData.append('fupload', file); // 'fupload' matches the Flask file input

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload', true);

            // Show spinner and hide progress bar when upload starts
            xhr.onloadstart = function () {
                document.getElementById('spinner').style.display = 'flex'; // Show spinner
                var progressBar = document.getElementById('progressBar');
                progressBar.style.width = '0%';
                progressBar.setAttribute('aria-valuenow', '0');
                progressBar.textContent = '0%';
            };

            // Track upload progress
            xhr.upload.onprogress = function (event) {
                if (event.lengthComputable) {
                    var percentComplete = Math.round((event.loaded / event.total) * 100);
                    var progressBar = document.getElementById('progressBar');
                    progressBar.style.width = percentComplete + '%';
                    progressBar.setAttribute('aria-valuenow', percentComplete);
                    progressBar.textContent = percentComplete + '%';
                }
            };

            xhr.onload = function () {
                if (xhr.status === 200) {
                    // Hide spinner and redirect after a short delay
                    document.getElementById('spinner').style.display = 'none';
                    window.location.href = "/view";
                    // Delay for smooth transition
                } else {
                    alert('File upload failed');
                }
            };

            xhr.send(formData);
        });

        document.getElementById('upfl').addEventListener('change', function (event) {
            let f = event.target.files[0];
            if (f) {
                let dt = new Date(f.lastModified);
                let s = (f.size / 1024).toFixed(2) + ' KB';
                document.getElementById('fd').innerHTML = dt;
                document.getElementById('fs').innerHTML = s;
            }
        });
    </script>

</body>

</html>
