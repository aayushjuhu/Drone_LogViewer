<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oswald">
    <link href="https://cdn.jsdelivr.net/gh/gitbrent/bootstrap-switch-button@1.1.0/css/bootstrap-switch-button.min.css"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <link rel="shortcut icon" href="/static/img/flaticon.png" type="image/x-icon">
    <link rel="stylesheet" href="static/css/style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script> <!--To manipulate graphs-->
    <title>LogViewer | Drone Attitude</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#"><img src="/static/img/logo.png" width="140vh" height="auto" class="d-inline-block align-top" alt="lovant-logo"></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="/view">Visualize</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/droneatt">Drone State</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/residual">Residual</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/dronepath">Drone Path</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Home</a>
                </li>
                </ul>
          </div>
        </div>
      </nav>

      <div class="container">
        <div class="col-sm-12 mt-4 text-center">
            <h2>Drone State</h2>
            <h4>Hover over the graph to Visualize drone state</h4>
        </div>
        <div class="row">
            <div class="col-sm-6" style="display: flex; justify-content: center; align-items: center; height: 80vh;">
                <div id="graphDiv" style="width: 600px; height: 400px;margin: auto;">
                    {% if fig %}
                    {{fig | safe}}
                    {% endif %} 
                </div>
            </div>
            <div class="col-sm-6">
                <img id="axes" src="/static/img/axes.png" alt="">
                <div id="container3D" style="width: 100%; height: 100vh;"></div>
            </div>
        </div>
      </div>
      <script type="text/javascript">
        // Variables passed from Flask
        const roll = {{ roll|safe }};   //ignore if any error();
        const pitch = {{ pitch|safe }}; //ignore if any error();
        const yaw = {{ yaw|safe }};     //ignore if any error();
        const time = {{ time|safe }};   //ignore if any error();

        // Plotly Graph
        const trace1 = {
            x: time,
            y: roll,
            mode: 'lines',
            name: 'Roll',
            marker: { color: 'red' }
        };

        const trace2 = {
            x: time,
            y: pitch,
            mode: 'lines',
            name: 'Pitch',
            marker: { color: 'blue' }
        };

        const trace3 = {
            x: time,
            y: yaw,
            mode: 'lines',
            name: 'Yaw',
            marker: { color: 'green' }
        };

        const data = [trace1, trace2, trace3];
        const layout = {
            title: 'Drone Roll, Pitch, Yaw over Time',
            xaxis: { title: 'Time' },
            yaxis: { title: 'Angle (degrees)' }
        };

        // Render the graph using Plotly
        Plotly.newPlot('graphDiv', data, layout).then(function () {
            const graphDiv = document.getElementById('graphDiv');

            // Hover event to rotate 3D model
            graphDiv.on('plotly_hover', function (data) {
                const index = data.points[0].pointIndex;
                const currentRoll = roll[index];
                const currentPitch = pitch[index];
                const currentYaw = yaw[index];

                rotateModel(currentRoll, currentPitch, currentYaw);  // Rotate the 3D model
            });
        });

        // Three.js 3D Model Rendering
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, -5, 30);

        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById("container3D").appendChild(renderer.domElement);

        const topLight = new THREE.DirectionalLight(0xffffff, 1.5);
        topLight.position.set(10, 10, 10);
        scene.add(topLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const loader = new THREE.GLTFLoader();
        let object;
        loader.load(
            '/static/models/drone/scene.gltf',
            function (gltf) {
                object = gltf.scene;
                object.scale.set(6, 6, 4);
                const initialRoll = -15;   // Example: Set the roll value in degrees
                const initialPitch = 35; // Example: Set the pitch value in degrees
                const initialYaw = 26;    // Example: Set the yaw value in degrees

                // Apply the initial rotation (convert degrees to radians)
                object.rotation.set(
                    THREE.Math.degToRad(initialPitch), // Pitch (around X-axis)
                    THREE.Math.degToRad(initialYaw),   // Yaw (around Y-axis)
                    THREE.Math.degToRad(initialRoll)   // Roll (around Z-axis)
                );
                scene.add(object);
            }
        );

        // Function to rotate the model
        function rotateModel(roll, pitch, yaw) {
            if (object) {
                object.rotation.x = THREE.Math.degToRad(pitch);  // Pitch (around X-axis)
                object.rotation.y = THREE.Math.degToRad(yaw);    // Yaw (around Y-axis)
                object.rotation.z = THREE.Math.degToRad(roll);   // Roll (around Z-axis)
            }
        }

        // Render loop
        function render() {
            requestAnimationFrame(render);
            renderer.render(scene, camera);
        }
        render();

        // Resize window adjustments
        window.addEventListener("resize", function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
