<html lang="en">

<head>

    <link rel="shortcut icon" href="/static/img/flaticon.png" type="image/x-icon">
    <link rel="stylesheet" href="static/css/style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script> <!--To manipulate graphs-->
    <title>Toggle Sync Example</title>
</head>

<body>
    <div id="att" class="att">{% if fig %}{{fig | safe}}{% endif %}</div>

    <script>
        var alt_plt = document.querySelector('.plotly-graph-div'); // Assuming 'plotly-graph' is the div where Plotly renders
        alt_plt.on('plotly_hover', function (eventData) {
            var hoverTime = eventData.points[0].x;
            console.log(hoverTime);
        });
    </script>
</body>

</html>
